name: 不具合報告
description: 日本語化MODの動作に関する不具合を報告します
title: "[Bug] "
labels:
  - bug
body:
  - type: markdown
    attributes:
      value: |
        確認に必要な情報を入力してください。

  - type: input
    id: game_version
    attributes:
      label: Survival Log バージョン
      placeholder: "例: 1.0.15369"
    validations:
      required: true

  - type: input
    id: mod_version
    attributes:
      label: 日本語化MOD バージョン
      placeholder: "例: v1.0.0-beta.1"
    validations:
      required: true

  - type: dropdown
    id: os
    attributes:
      label: OS
      options:
        - Windows 11
        - Windows 10
        - その他
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: 期待した動作
      description: 本来どうなるはずだったかを記載してください。
    validations:
      required: true

  - type: textarea
    id: actual
    attributes:
      label: 実際の動作
      description: 表示やエラーなど、実際に起きたことを記載してください。
    validations:
      required: true

  - type: textarea
    id: reproduce
    attributes:
      label: 再現手順
      placeholder: |
        1.
        2.
        3.
    validations:
      required: true

  - type: textarea
    id: logs
    attributes:
      label: ログ・スクリーンショット
      description: 個人情報や認証情報が含まれていないことを確認して添付してください。

  - type: checkboxes
    id: confirmations
    attributes:
      label: 確認事項
      options:
        - label: 対応ゲーム版と既知の問題を確認しました
          required: true
        - label: 同じ内容のIssueがないか確認しました
          required: true
